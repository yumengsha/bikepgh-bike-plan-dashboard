name: Refresh dashboard

on:
  schedule:
    - cron: "0 12 * * 1"   # every Monday 12:00 UTC (8am ET)
  workflow_dispatch:         # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write   # only used by the keep-alive step below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub pauses scheduled workflows in public repos after 60 days without a commit.
      # If the last commit is 45+ days old, push an empty commit so the weekly refresh keeps running.
      - name: Keep weekly refresh active
        if: github.event_name == 'schedule'
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $age_days days ago"
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep weekly refresh active"
            git push
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch City data
        run: python scripts/01_fetch_data.py

      - name: Process
        run: python scripts/02_process.py

      - name: Build dashboard
        run: |
          python scripts/03_build_dashboard.py
          mkdir -p site
          cp outputs/bike_plan_dashboard.html site/index.html
          cp data/processed/unbuilt_plan_projects_by_hin.csv site/
          cp data/processed/summary.json site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
